# Configuração da Base de Dados PostgreSQL
# Os valores vêm de variáveis de ambiente; o que está depois do ":" é o valor padrão para desenvolvimento local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configuração do Hibernate (criação automática de tabelas em desenvolvimento)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desliga o "Open Session in View": a sessão do banco fecha ao fim do @Transactional do Service,
# e não fica aberta durante a serialização do JSON (evita queries escondidas no Controller).
spring.jpa.open-in-view=false
